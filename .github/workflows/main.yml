name: Build StudyMate AI (Windows)

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: StudyMate-AI-main
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Generate Windows runner if needed
        shell: pwsh
        run: |
          if (!(Test-Path windows/runner)) { flutter create --platforms=windows . }

      - name: Use StudyMate logo as app icon
        shell: pwsh
        run: |
          Copy-Item assets/branding/studymate_app_icon.ico windows/runner/resources/app_icon.ico -Force

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        shell: pwsh
        continue-on-error: true
        run: |
          flutter analyze --no-pub 2>&1 | Tee-Object -FilePath analyze.log
          exit 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: analyze-log
          path: StudyMate-AI-main/analyze.log
          if-no-files-found: ignore

      - name: Build release
        run: flutter build windows --release

      - name: Build llama-server and whisper-cli from source
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/ggml-org/llama.cpp llama-src
          git clone --depth 1 https://github.com/ggerganov/whisper.cpp whisper-src
          # No OpenSSL, no curl, no OpenMP, no CPU-specific code:
          # the exe depends only on DLLs that ship with Windows or in the bin folder.
          $common = @(
            '-DCMAKE_BUILD_TYPE=Release',
            '-DBUILD_SHARED_LIBS=OFF',
            '-DGGML_NATIVE=OFF',
            '-DGGML_AVX2=ON',
            '-DGGML_OPENMP=OFF',
            '-DLLAMA_OPENSSL=OFF',
            '-DLLAMA_CURL=OFF',
            '-DLLAMA_BUILD_TESTS=OFF',
            '-DLLAMA_BUILD_EXAMPLES=OFF',
            '-DCMAKE_POLICY_DEFAULT_CMP0091=NEW',
            '-DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded'
          )
          cmake -S llama-src -B llama-build @common
          cmake --build llama-build --config Release --target llama-server -j 4
          cmake -S whisper-src -B whisper-build @common
          cmake --build whisper-build --config Release --target whisper-cli -j 4

          $bin = Join-Path 'build/windows/x64/runner/Release' 'bin'
          New-Item -ItemType Directory -Force -Path $bin | Out-Null
          $llama = Get-ChildItem llama-build -Recurse -Filter llama-server.exe | Select-Object -First 1
          $whisper = Get-ChildItem whisper-build -Recurse -Filter whisper-cli.exe | Select-Object -First 1
          if (-not $llama -or -not $whisper) { throw 'The build did not produce llama-server.exe or whisper-cli.exe' }
          Copy-Item $llama.FullName $bin -Force
          Copy-Item $whisper.FullName $bin -Force
          Get-ChildItem llama-build -Recurse -Filter *.dll | ForEach-Object { Copy-Item $_.FullName $bin -Force }
          Get-ChildItem whisper-build -Recurse -Filter *.dll | ForEach-Object { Copy-Item $_.FullName $bin -Force }

          # Safety net: if any OpenSSL DLL slipped in anyway, bundle it.
          Get-ChildItem 'C:\Program Files' -Recurse -Filter 'libcrypto-3-x64.dll' -ErrorAction SilentlyContinue |
            Select-Object -First 1 | ForEach-Object { Copy-Item $_.FullName $bin -Force; Write-Host "Bundled $($_.Name)" }
          Get-ChildItem 'C:\Program Files' -Recurse -Filter 'libssl-3-x64.dll' -ErrorAction SilentlyContinue |
            Select-Object -First 1 | ForEach-Object { Copy-Item $_.FullName $bin -Force; Write-Host "Bundled $($_.Name)" }

          Write-Host 'Files in bin:'
          Get-ChildItem $bin | ForEach-Object { Write-Host "  $($_.Name)  $($_.Length)" }

      - name: Smoke test with a clean PATH (catches missing DLLs)
        shell: pwsh
        run: |
          $bin = 'build/windows/x64/runner/Release/bin'
          # Remove everything except Windows system folders, so only bundled DLLs are available.
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          foreach ($exe in 'llama-server.exe', 'whisper-cli.exe') {
            $path = Join-Path $bin $exe
            & $path --help *> $null
            if ($LASTEXITCODE -ne 0 -and $LASTEXITCODE -ne 1) {
              throw "$exe cannot start on a clean PC, exit code $LASTEXITCODE"
            }
            Write-Host "$exe starts on a clean PATH."
          }

      - name: Download Visual C++ Redistributable for the installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path redist | Out-Null
          Invoke-WebRequest -Uri 'https://aka.ms/vs/17/release/vc_redist.x64.exe' -OutFile 'redist/vc_redist.x64.exe'
          if (!(Test-Path 'redist/vc_redist.x64.exe')) { throw 'Could not download vc_redist.x64.exe' }

      - name: Package ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path 'build/windows/x64/runner/Release/*' -DestinationPath 'StudyMate-AI-Windows.zip' -Force

      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' installer.iss

      - uses: actions/upload-artifact@v4
        with:
          name: StudyMate-AI-Windows
          path: StudyMate-AI-main/StudyMate-AI-Windows.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: StudyMate-AI-Setup
          path: StudyMate-AI-main/StudyMate-AI-Setup.exe
          if-no-files-found: error

      - name: Publish Windows release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            StudyMate-AI-main/StudyMate-AI-Windows.zip
            StudyMate-AI-main/StudyMate-AI-Setup.exe
